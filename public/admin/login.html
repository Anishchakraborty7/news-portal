<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | NR KHABOR</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">
  <link rel="stylesheet" href="/admin/admin.css">
  <script defer src="/admin/login.js"></script>
</head>
<body class="admin-login-page">
  <main class="login-card">
    <a class="brand" href="/"><span class="brand-mark"><img src="/assets/nr-khabar-logo.svg" alt=""></span><span><strong>NR KHABOR</strong><small>Content Studio</small></span></a>
    <h1>Admin Login</h1>
    <form data-login-form>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary-button">Login</button>
      <p class="form-message" data-message></p>
    </form>
  </main>
</body>
</html>
