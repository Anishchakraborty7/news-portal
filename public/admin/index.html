<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | NR KHABOR</title>
  <link rel="stylesheet" href="/css/styles.css?v=5">
  <link rel="stylesheet" href="/admin/admin.css?v=5">
  <script defer src="/admin/admin.js?v=5"></script>
</head>
<body class="admin-app">
  <aside class="admin-sidebar">
    <a class="brand" href="/admin"><span class="brand-mark"><img src="/assets/nr-khabar-logo.svg" alt=""></span><span><strong>NR KHABOR</strong><small>Content Studio</small></span></a>
    <nav>
      <a href="/admin" data-route="dashboard">Dashboard</a>
      <a href="/admin/news" data-route="news">News</a>
      <a href="/admin/advertisements" data-route="advertisements">Advertisements</a>
      <a href="/admin/slides" data-route="slides">Slides</a>
      <a href="/admin/categories" data-route="categories">Categories</a>
      <a href="/admin/settings" data-route="settings">Settings</a>
    </nav>
    <button class="logout-btn" data-logout>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Logout</span>
    </button>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><p class="eyebrow">Admin Studio</p><h1 data-page-title>Dashboard</h1></div>
      <a class="primary-button" href="/">View Website</a>
    </div>
    <div class="admin-toast-region" data-toast-region aria-live="polite"></div>
    <section data-view></section>
  </main>
</body>
</html>
